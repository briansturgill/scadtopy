[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scadtopy"
version = "0.1.0"
description = "Translate OpenSCAD files to Python code using Piecad."
requires-python = ">=3.10"
dependencies = [
    "openscad-parser",
    "piecad",
    "black",
]

[project.scripts]
scadtopy = "scadtopy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scadtopy*"]
